# OPTIONAL disk-cache service. Docker Compose 2.17+ (dockerfile_inline).
# docker compose -f compose.yaml -f compose.cache.yaml up --build -d
# Not loaded by plain `docker compose up`.
services:
  browser:
    environment:
      BROWSER_PROXY_URL: http://cache-proxy:8080
      HEALTH_PATH: /healthz
    depends_on:
      cache-proxy:
        condition: service_healthy

  cache-proxy:
    build:
      # Pin upstream source, but rebuild with the newer toolchain below.
      context: https://github.com/sanvit/s3-proxy.git#26e39a560d923c237dfec676eca70e15f5b5e1e6
      dockerfile_inline: |
        FROM golang:1.26-alpine AS build
        WORKDIR /src
        COPY . .
        RUN go test ./... && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /out/s3-proxy .
        FROM alpine:3
        RUN apk add --no-cache ca-certificates && adduser -D -H -u 10001 app && mkdir -p /cache && chown app:app /cache
        COPY --from=build /out/s3-proxy /usr/local/bin/s3-proxy
        USER app
        EXPOSE 8080
        HEALTHCHECK --interval=15s --timeout=3s --start-period=5s --retries=3 CMD wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1
        ENTRYPOINT ["/usr/local/bin/s3-proxy"]
    environment:
      LISTEN_ADDR: ':8080'
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DIR: /cache
      CACHE_BLOCK_SIZE: ${CACHE_BLOCK_SIZE:-8MiB}
      CACHE_SEGMENT_SIZE: ${CACHE_SEGMENT_SIZE:-2MiB}
      CACHE_DOWNLOAD_CONCURRENCY: ${CACHE_DOWNLOAD_CONCURRENCY:-4}
      ORIGIN_FETCH_MAX_SIZE: ${ORIGIN_FETCH_MAX_SIZE:-16MiB}
      ORIGIN_MAX_CONCURRENT_REQUESTS: ${ORIGIN_MAX_CONCURRENT_REQUESTS:-32}
      CACHE_MAX_DISK_SIZE: ${CACHE_MAX_DISK_SIZE:-100GB}
      CACHE_QUERY_MODE: ${CACHE_QUERY_MODE:-sort}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-1h}
      CACHE_MIN_TTL: ${CACHE_MIN_TTL:-0s}
      CACHE_MAX_TTL: ${CACHE_MAX_TTL:-168h}
      CACHE_RESPECT_ORIGIN: ${CACHE_RESPECT_ORIGIN:-true}
      CACHE_STALE_IF_ERROR: ${CACHE_STALE_IF_ERROR:-24h}
      CACHE_NEGATIVE_TTL_404: ${CACHE_NEGATIVE_TTL_404:-30s}
      CACHE_NEGATIVE_TTL_403: ${CACHE_NEGATIVE_TTL_403:-10s}
      CACHE_RULES_JSON: ${CACHE_RULES_JSON:-[]}
      INDEX_DOCUMENT: ''
      SPA_MODE: 'false'
      ERROR_PAGE_404: ''
      ERROR_PAGES_JSON: '{}'
      HEALTH_PATH: /healthz
      ACCESS_LOG: ${ACCESS_LOG:-true}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
    volumes:
      - object-cache:/cache
    # Do not publish a port: this service has no browser authentication.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  object-cache:
