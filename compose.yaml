# Single application with embedded caching for every storage backend.
# cp .env.example .env, then set the storage settings and browser authentication.
services:
  browser:
    build: .
    init: true
    env_file: .env
    environment:
      BROWSER_LISTEN_ADDR: ':8080'
      CACHE_DIR: /cache
    ports:
      - '127.0.0.1:${BROWSER_PORT:-8080}:8080'
    read_only: true
    volumes:
      - object-cache:/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  object-cache:
