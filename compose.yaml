# Standalone: only mori runs. Storage (S3 by default; WebDAV/FTP/SFTP via
# STORAGE_BACKEND) is contacted directly.
# cp .env.example .env, then set the storage settings and browser authentication.
# Optional disk cache: add -f compose.cache.yaml (see README.md).
services:
  browser:
    build: .
    init: true
    env_file: .env
    environment:
      BROWSER_LISTEN_ADDR: ':8080'
      # S3 only. Empty = mori connects to S3 itself. Not a required external service.
      BROWSER_PROXY_URL: ${BROWSER_PROXY_URL:-}
    ports:
      - '127.0.0.1:${BROWSER_PORT:-8080}:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
