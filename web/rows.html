{{define "rows"}}
{{- if .Parent}}<tr class="parent-row"><td class="select-cell"></td><td><a class="entry-link" href="{{.Parent}}" title="상위 폴더" aria-label="상위 폴더"><svg class="icon entry-icon parent"><use href="#i-parent"/></svg><span class="entry-title"><span class="entry-name">..</span></span></a></td><td class="date-cell"></td><td class="size-cell"></td><td class="action-cell"></td></tr>{{end}}
{{- range .Rows}}<tr class="{{if .Folder}}folder-row{{else}}file-row{{end}}" data-key="{{.Key}}" data-name="{{.Name}}" data-size="{{.Size}}" data-modified="{{.Modified}}"{{if .Folder}} data-folder="1"{{end}}{{if .Preview}} data-preview="1"{{end}}>
{{- if $.ZipEnabled}}<td class="select-cell"><label class="check-hit"><input type="checkbox" data-select-key="{{.Key}}" aria-label="{{.Name}} 선택"{{if .Folder}} title="하위 폴더와 파일을 모두 ZIP에 포함합니다."{{end}}></label></td>{{end}}
<td><a class="entry-link" href="{{.Href}}"{{if not .Folder}} target="_blank" rel="noopener noreferrer"{{end}} title="{{.LinkTitle}}"><svg class="icon entry-icon {{.Icon}}"><use href="#i-{{.Icon}}"/></svg><span class="entry-title"><span class="entry-name">{{.Name}}</span><span class="entry-mobile-meta">{{.MobileMeta}}</span></span></a></td>
<td class="date-cell"{{if .ModifiedTitle}} title="{{.ModifiedTitle}}"{{end}}>{{.DateText}}</td>
<td class="size-cell"{{if not .Folder}} title="{{.Size}} bytes"{{end}}>{{.SizeText}}</td>
<td class="action-cell">{{if not .Folder}}<a class="icon-button download" href="{{.DownloadHref}}" download="{{.Name}}" title="{{$.DownloadTitle}}" aria-label="{{.Name}} 다운로드"><svg class="icon"><use href="#i-download"/></svg></a>{{end}}</td>
</tr>{{end}}
{{- if not .Rows}}<tr class="message-row"><td class="message" colspan="{{.Columns}}">{{.EmptyMessage}}</td></tr>{{end}}
{{end}}
