name: Publish continuous build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build binaries and container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch pinned browser assets
        run: python3 tools/vendor.py

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bin dist

          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="mori-${goos}-${goarch}"
            binary="$archive"

            if [[ "$goos" == "windows" ]]; then
              binary="${binary}.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags='-s -w' -o "release-bin/$binary" ./cmd/mori

            if [[ "$goos" == "windows" ]]; then
              (cd release-bin && zip -q "../dist/${archive}.zip" "$binary")
            else
              (cd release-bin && tar -czf "../dist/${archive}.tar.gz" "$binary")
            fi
          done

          sha256sum dist/* | sed 's#dist/##' > dist/checksums.txt

      - name: Upload binaries for the release job
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Update continuous release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist

      - name: Create or update continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view continuous >/dev/null 2>&1; then
            git push --force origin "$GITHUB_SHA:refs/tags/continuous"
            gh release upload continuous dist/* --clobber
            gh release edit continuous \
              --target "$GITHUB_SHA" \
              --title "Continuous build" \
              --notes "Automated build of main at \`$GITHUB_SHA\`." \
              --draft=false \
              --prerelease
          else
            gh release create continuous dist/* \
              --target "$GITHUB_SHA" \
              --title "Continuous build" \
              --notes "Automated build of main at \`$GITHUB_SHA\`." \
              --prerelease
          fi
